# CI для GitHub Actions (репозиторий на GitHub).
# Два job'а: Maven-проверки и e2e на реальном стеке.
#
# Приложение нигде не контейнеризуется: в CI (как и локально) оно запускается
# на хосте через spring-boot:run, в Docker поднимается только инфраструктура.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Maven (checkstyle, spotless, verify)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Стиль, юнит- и интеграционные тесты
        run: ./mvnw -B spotless:check checkstyle:check verify

  checks:
    name: Статические проверки (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  e2e:
    name: E2E (инфраструктура в compose, приложение на хосте)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Секреты CI (временные, только для запуска)
        run: |
          cp infrastructure/.env.dev.example infrastructure/.env
          sed -i \
            -e "s|^CAPTCHA_HMAC_SECRET=.*|CAPTCHA_HMAC_SECRET=$(openssl rand -base64 32)|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -base64 32)|" \
            -e "s|^MINIO_ROOT_USER=.*|MINIO_ROOT_USER=rhd-ci|" \
            -e "s|^MINIO_ROOT_PASSWORD=.*|MINIO_ROOT_PASSWORD=$(openssl rand -base64 32)|" \
            -e "s|^METRICS_PASSWORD=.*|METRICS_PASSWORD=$(openssl rand -base64 32)|" \
            -e "s|^KEYCLOAK_ADMIN_PASSWORD=.*|KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -base64 32)|" \
            infrastructure/.env
      - name: Поднять инфраструктуру и наблюдаемость
        run: make dev-run
      - name: Запустить приложение на хосте
        run: nohup make run-local > app.log 2>&1 &
      - name: Дождаться готовности приложения
        run: |
          timeout 240 bash -c 'until curl -sf http://localhost:8080/api/v1/health >/dev/null; do echo "wait..."; sleep 5; done'
      - name: Дождаться готовности Keycloak
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8180/realms/realhelpdesk/.well-known/openid-configuration >/dev/null; do echo "wait keycloak..."; sleep 5; done'
      - name: E2E-сценарии
        run: make e2e-all
      - name: Логи (при падении)
        if: failure()
        run: |
          echo "── app (хостовый процесс)"
          tail -n 400 app.log || true
          echo "── контейнеры"
          docker compose -f infrastructure/docker-compose.yaml -f infrastructure/docker-compose.override.yaml \
            --profile infra --profile local-tools ps || true
          docker compose -f infrastructure/docker-compose.yaml -f infrastructure/docker-compose.override.yaml \
            --profile infra --profile local-tools logs --no-color || true
      - name: Остановить стек
        if: always()
        run: make dev-down
