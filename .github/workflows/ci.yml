# CI для GitHub Actions (репозиторий на GitHub).
# Три независимых job'а: Maven-проверки, проверки образа, e2e на реальном стеке.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Maven (checkstyle, spotless, verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Стиль, юнит- и интеграционные тесты
        run: ./mvnw -B spotless:check checkstyle:check verify

  docker:
    name: Образ (hadolint, trivy, gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:2.12.0 < Dockerfile
      - name: Сборка образа
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t realhelpdesk:ci .
      - name: trivy (CRITICAL/HIGH)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.2 image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed realhelpdesk:ci
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose

      # Пуш в ghcr.io — только при пуше в main (не на PR)
      - name: Login to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Теги и пуш образа (sha-<git_sha> + latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          docker tag realhelpdesk:ci "${IMAGE}:sha-${GITHUB_SHA}"
          docker tag realhelpdesk:ci "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  e2e:
    name: E2E на compose-стеке
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Секреты CI (временные, только для запуска)
        run: |
          cp infrastructure/.env.example infrastructure/.env
          sed -i \
            -e "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 32)|" \
            -e "s|^CAPTCHA_HMAC_SECRET=.*|CAPTCHA_HMAC_SECRET=$(openssl rand -base64 32)|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -base64 32)|" \
            -e "s|^KEY_STORE_PASS=.*|KEY_STORE_PASS=$(openssl rand -hex 8)|" \
            -e "s|^MINIO_ROOT_USER=.*|MINIO_ROOT_USER=rhd-ci|" \
            -e "s|^MINIO_ROOT_PASSWORD=.*|MINIO_ROOT_PASSWORD=$(openssl rand -base64 32)|" \
            -e "s|^METRICS_PASSWORD=.*|METRICS_PASSWORD=$(openssl rand -base64 32)|" \
            -e "s|^KEYCLOAK_ADMIN_PASSWORD=.*|KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -base64 32)|" \
            infrastructure/.env
          # MAIL_PASSWORD остаётся пустым: локальному smtp4dev пароль не нужен
      - name: Поднять стек
        run: make up
      - name: Дождаться готовности приложения
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8081/actuator/health >/dev/null; do echo "wait..."; sleep 5; done'
      - name: Дождаться готовности Keycloak
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8180/realms/realhelpdesk/.well-known/openid-configuration >/dev/null; do echo "wait keycloak..."; sleep 5; done'
      - name: E2E-сценарии
        run: make e2e-all
      - name: Логи стека (при падении)
        if: failure()
        run: |
          docker compose -f infrastructure/docker-compose.yaml -f infrastructure/docker-compose.override.yaml --profile infra --profile local-tools --profile app ps || true
          docker compose -f infrastructure/docker-compose.yaml -f infrastructure/docker-compose.override.yaml --profile infra --profile local-tools --profile app logs --no-color || true
      - name: Остановить стек
        if: always()
        run: make down
