# Единый compose всего стека — один файл, различия между средами и
# секреты живут в infrastructure/.env (шаблон — infrastructure/.env.example).
#
# Профили (запуск — только через make, набор профилей передаётся явно):
#   infra       — postgres, minio: внутренняя сеть data (internal), портов на хост нет
#   local-tools — smtp4dev и keycloak (локальные сервисы разработки)
#   app         — приложение
#   monitoring  — mimir, tempo, loki, otel-collector, alloy
#   load        — k6
#
# make up-deps     → infra + local-tools        (зависимости для запуска app из IDEA)
# make up          → infra + local-tools + app  (локальная разработка)
# make up-prod     → infra + app                (рабочий контур: без local-tools/monitoring)
# make obs-up      → infra + local-tools + app + monitoring
# make down        → все профили (останавливает что угодно)
#
# Порты БД/MinIO на loopback хоста (для IDEA/psql/MinIO-консоли) публикует
# infrastructure/docker-compose.override.yaml — локальный оверлей, который
# make подключает явно (-f) для локальных целей; make up-prod (base + prod)
# его игнорирует, поэтому в рабочем контуре на хост не выходит ничего.
#
# Профиль приложения (SPRING_PROFILES_ACTIVE в infrastructure/.env) — dev/prod,
# по умолчанию + keycloak: токены выпускает сервис keycloak, приложение только
# проверяет подпись по JWK. Без keycloak работает внутренний JWT-контур
# приложения (cookie, /api/v1/auth/*) — им пользуются сценарии scripts/e2e-*.sh.
# Сервис keycloak живёт в профиле local-tools, поэтому make up-prod поднимает
# приложение без него: в рабочем контуре Keycloak разворачивается отдельно (см. README).
#
# Сети:
#   data    — internal: true: postgres, minio + app; наружу не ходит,
#             портов на хост не имеет — изолированы БД и хранилище файлов
#             (в локальном оверлее postgres/minio дополнительно подключаются
#             к backend — только так Docker публикует их порты на хост)
#   backend — обычная: app (в т.ч. наружу — SMTP/прокси), smtp, keycloak и
#             наблюдаемость; k6 ходит в app по ней
#
# Секреты и настройки среды: только ${VAR} из infrastructure/.env — compose
# валит старт при пустом обязательном секрете (?-синтаксис). Три динамических
# ключа (OTLP_TRACING_ENDPOINT, TRUST_PROXY_HEADERS, CLIENT_IP_FORWARDED_INDEX)
# задаются интерполяцией с дефолтами: make obs-up / up-load передают их
# инлайном, постоянно — в infrastructure/.env.

# Имя проекта compose: фиксировано, чтобы тома и сети пережили переход
# на единый файл (имена томов realhelpdesk_* не меняются).
name: realhelpdesk

# Логи контейнеров: json-file с ротацией — docker logs не раздувает диск
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  # Изолированная сеть данных: без выхода наружу и без портов на хосту.
  # app попадает сюда же — приложению нужен доступ к БД и MinIO.
  data:
    internal: true
  backend:

services:
  # ==========================================================================
  # Профиль app: приложение
  # ==========================================================================
  app:
    profiles: [app]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Ревизия git для LABEL org.opencontainers.image.revision (Makefile передаёт)
        GIT_SHA: "${GIT_SHA:-unknown}"
    image: realhelpdesk:latest
    ports:
      - "8443:8443"
      # Управляющий порт actuator (health/info/prometheus) — только loopback:
      # наружу (и в сеть контейнеров) он доступен приложению и скрейпу (alloy)
      # без проброса на хост.
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      # JVM пишет ErrorFile/heap dump в /tmp; uid/gid приложения — 10001 (Dockerfile)
      - /tmp:size=64m
      - /app/ssl:rw,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    memswap_limit: 768m
    # Единственный env-файл приложения — infrastructure/.env (он же источник
    # ${VAR}-интерполяции ниже); парность ключей контроллирует ApplicationConfigSchemaTest.
    env_file:
      - ./.env
    environment:
      # Секреты: несекретные ключи — в infrastructure/.env.example/.env.
      # Имена совпадают с переменными .env (переименований DB_PASSWORD→DB_PASS
      # и т.п. больше нет): env_file передал бы их и сам, но environment с
      # ?-синтаксисом даёт fail-fast на старте compose при пустом секрете.
      KEY_STORE_PASS: "${KEY_STORE_PASS:?KEY_STORE_PASS is required - copy infrastructure/.env.example to infrastructure/.env}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - copy infrastructure/.env.example to infrastructure/.env}"
      CAPTCHA_HMAC_SECRET: "${CAPTCHA_HMAC_SECRET:?CAPTCHA_HMAC_SECRET is required - copy infrastructure/.env.example to infrastructure/.env}"
      MAIL_PASSWORD: "${MAIL_PASSWORD-}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - copy infrastructure/.env.example to infrastructure/.env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
      METRICS_PASSWORD: "${METRICS_PASSWORD:?METRICS_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
      # Профиль приложения: переключается инлайном (make profile-local / profile-keycloak)
      # или переменной окружения хоста. Дефолт в application.properties — 'dev'.
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      # KC_JWK_SET_URI/KC_ISSUER_URI (профиль приложения keycloak) сюда не
      # попадают: они несекретные и объявлены в infrastructure/.env.example,
      # а контейнер получает их через env_file — иначе одно значение задавалось
      # бы в двух местах (это запрещает ApplicationConfigSchemaTest).
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # TCP-проба без curl/wget в образе JRE: bash /dev/tcp открывает сокет
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8443'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - backend
      - data
    logging: *default-logging
    labels:
      org.opencontainers.image.source: "https://github.com/dx9119/realhelpdesk-api"

  # ==========================================================================
  # Профиль infra: данные (внутренняя сеть data, БЕЗ портов на хосту)
  # ==========================================================================
  postgres:
    profiles: [infra]
    # PostgreSQL 18 хранит данные в каталоге со своим мажорным версионом
    # (PGDATA=/var/lib/postgresql/18/docker), поэтому том монтируется на
    # /var/lib/postgresql — родительский каталог, а не .../data, как в 15–17.
    # Монтировать на /var/lib/postgresql/data нельзя: образ 18 считает такой
    # том остатком старой версии и завершает работу с подсказкой по pg_upgrade.
    image: postgres:18
    mem_limit: 2g
    # Общедоступный shared_buffers: PostgreSQL по умолчанию считает, что у него
    # весь хост, и shm-сегмент ломается при ограничении памяти контейнера
    shm_size: 256m
    environment:
      # Имя БД и пользователь — с дефолтами (user/desk); переопределяются
      # infrastructure/.env (POSTGRES_USER/POSTGRES_DB), пароль — секрет.
      POSTGRES_USER: "${POSTGRES_USER:-user}"
      POSTGRES_DB: "${POSTGRES_DB:-desk}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - data
    logging: *default-logging

  minio:
    profiles: [infra]
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    mem_limit: 1g
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - copy infrastructure/.env.example to infrastructure/.env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - data
    logging: *default-logging

  # ==========================================================================
  # Профиль local-tools: локальная почта (порты — только loopback хоста)
  # ==========================================================================
  smtp:
    profiles: [local-tools]
    # Локальный SMTP: smtp4dev без аутентификации, UI — http://localhost:3000.
    # Порты привязаны к loopback, как и остальные сервисы на хосту.
    image: rnwood/smtp4dev:3.15.0
    mem_limit: 64m
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

  # ==========================================================================
  # Профиль local-tools: Keycloak (внешний выпуск токенов)
  # ==========================================================================
  # Приложение по умолчанию стартует с профилем keycloak
  # (SPRING_PROFILES_ACTIVE=dev,keycloak в infrastructure/.env): токены
  # выпускает и подписывает Keycloak, приложение только проверяет подпись по
  # JWK и читает email/realm-роли из токена. Переключение на внутреннюю
  # JWT-логику — убрать keycloak из SPRING_PROFILES_ACTIVE (см. README).
  #
  # Realm realhelpdesk импортируется из ./keycloak/realhelpdesk-realm.json при
  # первом старте (--import-realm): роли ROLE_USER/ROLE_OPERATOR/ROLE_NONE,
  # публичный клиент realhelpdesk-api (Authorization Code + PKCE, direct access
  # grant для отладки и e2e) и два тестовых пользователя (user@example.com,
  # operator@example.com).
  keycloak-postgres:
    profiles: [local-tools]
    # Отдельный кластер PostgreSQL под схему Keycloak. Прежняя схема («та же
    # БД, отдельная база») требовала сервиса-костыля keycloak-db-init: том
    # postgres_data к моменту старта Keycloak уже инициализирован, и
    # docker-entrypoint-initdb.d не отработал бы. Собственный том снимает
    # проблему — базу создаёт штатный POSTGRES_DB при первой инициализации.
    # Плюсы раздельных кластеров: миграции Keycloak физически не задевают
    # данные приложения, том Keycloak выгружается/удаляется независимо,
    # отказ одного кластера не роняет второй, креды разные.
    # Тот же тег postgres:18, что у основной БД — поведение и формат тома идентичны.
    image: postgres:18
    mem_limit: 256m
    shm_size: 128m
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: "${KEYCLOAK_DB:-keycloak}"
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d ${KEYCLOAK_DB:-keycloak}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - data
    logging: *default-logging

  keycloak:
    profiles: [local-tools]
    # Версия закреплена: обновление — осознанная правка с ревью, не latest.
    # start-dev: HTTP без TLS и кэш в памяти — локальный стенд; в рабочем
    # контуре Keycloak разворачивается отдельно (см. README).
    image: quay.io/keycloak/keycloak:26.6
    mem_limit: 768m
    ports:
      # Только loopback: браузер ходит за токеном на 127.0.0.1:8180, наружу
      # Keycloak не публикуется. 8180, а не 8080: 8080 занят другими стендами.
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    environment:
      # Начальный администратор создаётся только при пустой БД (bootstrap).
      # Пароль необязателен: сервис живёт только в
      # профиле local-tools и слушает loopback, а пустое значение поднимает стенд с
      # дефолтным admin — заполните, если стенд доступен не только вам.
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      # Хранилище realm'а: отдельный кластер PostgreSQL (keycloak-postgres) со
      # своим томом и kredами — данные Keycloak физически отделены от приложения.
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: "${KEYCLOAK_DB:-keycloak}"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
      # KC_HOSTNAME — адрес, который попадает в issuer (iss) токена и в ссылки
      # страницы входа: его видит браузер, поэтому loopback с портом на хосте.
      # Приложение при этом проверяет подпись по KC_JWK_SET_URI — адресу
      # Keycloak во внутренней сети (см. infrastructure/.env), иначе issuer в
      # токене не совпадёт с тем, что доступно из контейнера приложения.
      KC_HOSTNAME: "${KC_HOSTNAME:-http://localhost:8180}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Health и метрики на управляющем порту 9000 (используется healthcheck).
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      # Каталог импорта целиком (read-only): --import-realm читает все
      # *-realm.json, поэтому новый realm добавляется файлом, без правки compose.
      - ./keycloak:/opt/keycloak/data/import:ro
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      # TCP-проба без curl/wget в образе: bash /dev/tcp открывает сокет.
      # Порт 9000 — управляющий (health/metrics), основной 8080 отдаёт только
      # приложение Keycloak и «зеленеет» раньше готовности realm'а.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      # backend — чтобы опубликованный порт работал (на internal-сети docker
      # его не пробрасывает), data — чтобы достучаться до postgres.
      - backend
      - data
    logging: *default-logging

  # ==========================================================================
  # ==========================================================================
  # Профиль monitoring: Mimir, Tempo, OTel Collector, Loki, Alloy
  # ==========================================================================
  # ==========================================================================
  # Топология: приложение шлёт трейсы OTLP → otel-collector → tempo; логи
  # (stdout json-file приложения) тянет alloy → loki; метрики alloy скрейпит
  # с app:8081 и шлёт remote_write в mimir; Mimir отдаёт метрики по
  # Prometheus-совместимому API (localhost:9090/api/v1/query и /prometheus).
  mimir:
    profiles: [monitoring]
    # Mimir (monolithic): хранение метрик, Prometheus-совместимый API, ruler.
    # Версия закреплена: обновление — осознанная правка с ревью, не latest.
    image: grafana/mimir:2.16.0
    mem_limit: 512m
    ports:
      # Только loopback: query API /prometheus и ruler (хостовой порт 9090,
      # как у прежнего Prometheus — make obs-alerts и curl не меняются по адресу).
      - "127.0.0.1:9090:8090"
    volumes:
      - ./observability/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      # Правила алертов (Prometheus-формат); проверка — promtool check rules.
      # Раскладка local store: <dir>/<tenant>/<файл>, tenant=anonymous.
      - ./observability/mimir/rules:/etc/mimir/rules:ro
      # Fallback-конфиг встроенного Alertmanager (storage пуст — без него 412).
      - ./observability/mimir/alertmanager-fallback.yml:/etc/mimir/alertmanager-fallback.yml:ro
      - mimir_data:/data
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

  otel-collector:
    profiles: [monitoring]
    # Версия закреплена; конфиг — OTLP → batch → Tempo (см. observability/otel-collector/).
    image: otel/opentelemetry-collector-contrib:0.162.0
    mem_limit: 256m
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      tempo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

  tempo:
    profiles: [monitoring]
    # Хранилище трейсов (filesystem + WAL); retention 48h задан в tempo.yaml.
    image: grafana/tempo:2.8.0
    mem_limit: 512m
    ports:
      # Только loopback, для отладки (/ready, поиск trace по API).
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

  loki:
    profiles: [monitoring]
    # Single-binary, filesystem-хранилище; слушает только внутреннюю сеть + loopback.
    # root: образ Loki по умолчанию идёт под nobody и не может создать /var/loki/{chunks,rules}
    # в новом volume; локальный dev-стенд, сеть loopback.
    image: grafana/loki:3.5.0
    user: "0:0"
    mem_limit: 256m
    ports:
      # Только loopback, для отладки (/ready, query_range).
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/var/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

  alloy:
    profiles: [monitoring]
    # Сбор логов приложения (docker json-file, фильтр compose-метки service=app) → Loki
    # и скрейп метрик (app:8081/actuator/prometheus, HTTP Basic) → remote_write в Mimir.
    # root нужен для доступа к /var/run/docker.sock — локальный dev-стенд.
    image: grafana/alloy:v1.12.2
    user: "0:0"
    mem_limit: 128m
    # Креды скрейпа: sys.env() в config.alloy читает METRICS_USER/METRICS_PASSWORD.
    env_file:
      - ./.env
    environment:
      METRICS_PASSWORD: "${METRICS_PASSWORD:?METRICS_PASSWORD is required - copy infrastructure/.env.example to infrastructure/.env}"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    depends_on:
      loki:
        condition: service_healthy
      mimir:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

  # ==========================================================================
  # Профиль load: нагрузочный прогон (scripts/load/, k6)
  # ==========================================================================
  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - ../scripts/load:/scripts:ro
    working_dir: /scripts
    entrypoint: ["k6"]
    command: ["run", "/scripts/user-journey.js"]
    environment:
      BASE_URL: https://app:8443
      POOL_SIZE: ${POOL_SIZE:-8}
      TARGET_VUS: ${TARGET_VUS:-10}
      DURATION: ${DURATION:-5m}
      THINK_TIME: ${THINK_TIME:-1}
      WAIT_TIMEOUT_SEC: ${WAIT_TIMEOUT_SEC:-3}
      # RUN_ID подставляет scripts/load/run.sh через docker compose run -e
      RUN_ID: ${RUN_ID:-local}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  keycloak_postgres_data:
  minio_data:
  mimir_data:
  tempo_data:
  loki_data:
  alloy_data:
