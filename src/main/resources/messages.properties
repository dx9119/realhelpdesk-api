email.registration.link.subject=Подтверждение регистрации
email.registration.link.body=Добрый день!\n\nДля завершения регистрации в системе «{0}», пожалуйста, подтвердите ваш адрес электронной почты, перейдите по ссылке:\nhttps://{1}/notify-settings\n\nВ поле "✅ Подтверждение Email", введите данный код:\n{2}\n\nС уважением,\nКоманда {0}\n
email.registration.code.subject=Код подтверждения
email.registration.code.body=Добрый день!\n\nДля подтверждения email в системе «{0}» - перейдите по ссылке:\nhttps://{1}/notify-settings\n\nВ поле "✅ Подтверждение Email", введите данный код:\n{2}\n\nС уважением,\nКоманда {0}\n
email.password.reset.subject=Сброс пароля
email.password.reset.body=Добрый день!\n\nМы получили запрос на сброс пароля для вашей учётной записи в системе «{0}».\n\nЧтобы установить новый пароль, перейдите по ссылке:\nhttps://{1}/pass-reset?code={2}\n\nЕсли вы не запрашивали сброс пароля, просто проигнорируйте это письмо — никаких действий предпринимать не нужно.\n\nС уважением,\nКоманда {0}\n
email.ticket.reply.subject=[Заявка#{0}] Новое сообщение
email.ticket.reply.body=Добрый день!\n\nВ заявке #{0} появилось новое сообщение.\n\nОзнакомиться с ним можно по ссылке:\nhttps://{1}/ticket-show/portal/{2}/ticket/{0}\n\nС уважением,\nКоманда {3}\n
email.ticket.created.subject=Создана новая заявка #{0}
email.ticket.created.body=Добрый день!\n\nСоздана заявка #{0}\n\nОзнакомиться с ней можно по ссылке:\nhttps://{1}/ticket-show/portal/{2}/ticket/{0}\n\nС уважением,\nКоманда {3}\n
email.portal.created.subject=Создан новый портал #{0}
email.portal.created.body=Добрый день!\n\nСоздан портал #{0}\n\nОзнакомиться с ним можно на странице "Порталы", в разделе "мои порталы".\nhttps://{1}/portal-manager\n\nС уважением,\nКоманда {2}\n
email.portal.add.user.subject=Вас добавили к порталу #{0}
email.portal.add.user.body=Добрый день!\n\nОзнакомиться с порталом можно на странице "Порталы", в разделе "Общие порталы".\nhttps://{0}/portal-manager\n\nС уважением,\nКоманда {1}\n
email.ticket.status.subject=Задан статус:{0} для заявки#{1}
email.ticket.status.body=Добрый день!\n\nОзнакомиться с заявкой можно по ссылке:\nhttps://{0}/ticket-show/portal/{1}/ticket/{2}\n\nС уважением,\nКоманда {3}\n
email.ticket.priority.subject=Задан приоритет:{0} для заявки#{1}
email.ticket.priority.body=Добрый день!\n\nОзнакомиться с заявкой можно по ссылке:\nhttps://{0}/ticket-show/portal/{1}/ticket/{2}\n\nС уважением,\nКоманда {3}\n
email.ticket.deleted.subject=Удалена заявка#{0}
email.ticket.deleted.body=Добрый день!\n\nЗаявка #{0} была удалена пользователем {1}.\n\nС уважением,\nКоманда {2}\n
email.portal.deleted.subject=Удален портал#{0}
email.portal.deleted.body=Добрый день!\n\nПортал #{0} был удален пользователем {1}.\n\nС уважением,\nКоманда {2}\n
email.portal.transfer.requested.subject=Передача портала #{0}
email.portal.transfer.requested.body=Добрый день!\n\nВладелец портала #{0} ({1}) начал передачу портала другому пользователю.\n\nПричина: {2}\n\nС уважением,\nКоманда {3}\n
email.portal.transfer.proposed.subject=Вам передают портал #{0}
email.portal.transfer.proposed.body=Добрый день!\n\n{1} предлагает передать вам владение порталом #{0}.\n\nПричина: {2}\n\nПринять или отклонить предложение можно по ссылке (срок действия — 72 часа):\nhttps://{3}/portal-transfer/{0}\n\nС уважением,\nКоманда {4}\n
email.portal.transfer.accepted.subject=Портал #{0} сменил владельца
email.portal.transfer.accepted.body=Добрый день!\n\nВладелец портала #{0} теперь — {1}.\n\nПричина передачи: {2}\n\nС уважением,\nКоманда {3}\n
email.portal.transfer.rejected.subject=Запрос на передачу портала #{0} отклонён
email.portal.transfer.rejected.body=Добрый день!\n\nПользователь {1} отклонил передачу вам портала #{0}.\n\nПричина: {2}\n\nС уважением,\nКоманда {3}\n
email.portal.transfer.cancelled.subject=Передача портала #{0} отменена
email.portal.transfer.cancelled.body=Добрый день!\n\n{1} отозвал предложение передать вам владение порталом #{0}.\n\nС уважением,\nКоманда {2}\n
email.portal.transfer.expired.subject=Истёк срок передачи портала #{0}
email.portal.transfer.expired.body=Добрый день!\n\nСрок действия запроса на передачу портала #{0} истёк — портал остался за вами.\n\nС уважением,\nКоманда {1}\n
email.notification.repeat.subject=[Напоминание] {0}
email.notification.repeat.body=Добрый день!\n\nВы ещё не прочитали уведомление: {0}\n\nОзнакомиться можно по ссылке:\nhttps://{1}/ticket-show/portal/{2}/ticket/{3}\n\nС уважением,\nКоманда {4}\n
