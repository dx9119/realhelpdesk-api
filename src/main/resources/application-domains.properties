# ===========================================================================
# Доменные имена и URL приложения. Схема, значений здесь НЕТ: только
# обязательные переменные окружения вида ${VAR} — без дефолтов.
#
# Подключается из application.properties через spring.config.import.
# Значения лежат в infrastructure/.env (шаблон — infrastructure/.env.dev.example;
# JWT_ISSUER/JWT_AUDIENCE, FRONT_DOMAIN,
# CORS_ALLOWED_ORIGINS, MAIL_FROM/MAIL_NOTIFY); секретов здесь нет.
#
# Как поменять: правка значения + `docker compose up -d` (пересборка образа
# нужна, только если менялся код, читающий эти ключи).
# Парность схемы и infrastructure/.env.dev.example проверяет ApplicationConfigSchemaTest.
# ===========================================================================

# --- Токены (JWT) ---
# Прописываются в каждый токен при выпуске (GenTokenService) и сверяются
# при валидации (JwtAuthFilter, ValidTokenService): несовпадение = токен
# отвергается. Значения — полные URL вида https://host, одинаковые для
# выдачи и проверки; меняются только вместе с ключом подписи JWT_SECRET.
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

# --- Фронт в письмах ---
# Домен фронта, который собирается в ссылки писем: сообщения вида
# https://{1}/pass-reset?code=... в src/main/resources/messages.properties.
# Без протокола и без слэша на конце. Значение зависит от окружения —
# задаётся в infrastructure/.env (FRONT_DOMAIN, секция почты).
email.domain=${FRONT_DOMAIN}

# --- Почтовые адреса (домены отправителя) ---
# From в письмах и адрес, куда уходят уведомления о заявках.
# Название письма и проекта (APP_PROJECT_NAME) — домены не содержит,
# поэтому остаётся в application.properties.
email.from=${MAIL_FROM}
email.notify=${MAIL_NOTIFY}

# --- CORS: origin'ы фронта, которым разрешён доступ к API ---
# Список через запятую, каждый — полный origin (схема + хост [+ порт]).
# Раньше был захардкожен в AppConfig#corsConfigurationSource; браузер
# сравнивает origin запроса со списком буквально, поэтому «example.com»
# и «https://example.com» — разные значения. Пустой список = любой origin
# не пройдёт, включая фронт.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Статический контент: отдельный origin для файлов ---
# Публичный адрес раздачи файлов вложений — отдельный домен или ip:port,
# который стоит перед приложением (reverse-proxy, дальше — CDN). Из него
# собирается downloadUrl в ответах API; пусто — ссылки относительные, файлы
# отдаёт сам API на своём хосте (поведение без настройки не меняется).
# Формат — origin целиком (схема + хост [+ порт]), хвостовой слэш не нужен,
# обрезается автоматически. Против хоста фронта — origin фронта должен быть
# в CORS_ALLOWED_ORIGINS; если домен отличен от домена API, нужен ещё
# jwt.cookie.domain — иначе host-only cookie на этот домен не уходит (401).
static.base-url=${STATIC_BASE_URL}
