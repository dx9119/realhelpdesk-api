# ===========================================================================
# Профиль keycloak — OAuth2 Resource Server (Keycloak).
#
# В этом профиле токены выпускает и проверяет Keycloak: приложение только
# валидирует подпись по JWK и читает из токена email и realm-роли.
# Эндпоинты регистрации/входа/логаута через cookie отключены (AuthController,
# JwtAuthFilter, CsrfProtectionFilter помечены @Profile("!keycloak")) —
# пользователь аутентифицируется в Keycloak, а приложение получает уже
# выпущенный access-токен.
#
# Профиль включается вместе с базовым (SPRING_PROFILES_ACTIVE=dev,keycloak
# или prod,keycloak) — этот файл только добавляет keycloak-специфичные ключи.
# Значения — в infrastructure/.env.
# ===========================================================================

# --- OAuth2 Resource Server ---
# jwk-set-uri — публичный ключ для проверки подписи токенов.
# issuer-uri — валидация claim iss (и адрес для discovery, если jwk-set-uri не задан).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KC_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI}

# --- Пользователи и роли Keycloak ---
# Роль приложение читает из БД (как и в локальном контуре), поэтому realm-роли
# токена переносятся в UserRole при каждом входе; повышение роли в Keycloak
# действует сразу, понижение — только через правку роли в БД.
keycloak.sync-roles=true
# Создавать учётную запись при первом входе через Keycloak. false — неизвестный
# email получает 401: аккаунт должен существовать заранее.
keycloak.auto-create-users=true
