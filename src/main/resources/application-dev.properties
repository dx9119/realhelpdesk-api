# Локальная отладка: трассировка приложения и SQL без значений параметров
# (bind TRACE печатает параметры запросов, среди них бывают пароли и токены).

# Docker Compose отключён: инфраструктура (Postgres, MinIO, SMTP) запускается
# отдельно через make (dev-run). Для host-профиля управление
# инфраструктурой через compose включено в application-host.properties.
spring.docker.compose.enabled=false

logging.level.root=INFO
logging.level.com.ukhanov.realhelpdesk=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
# Thymeleaf — отключён кэш, чтобы правки шаблонов применялись без рестарта
logging.level.org.thymeleaf=DEBUG
spring.thymeleaf.cache=false

# Медленные запросы и метрики Hibernate: статистика нужна для hibernate.*-метрик,
# включена только здесь — вне dev накладные расходы не оправданы без алертов.
spring.jpa.properties.hibernate.generate_statistics=true

# Трейсы уходят в Tempo сразу: dev-контур (make dev-run) поднимает otel-collector
# с портом 4318 на loopback, приложение на хосте шлёт OTLP HTTP на localhost:4318.
# Дефолт здесь, а не в application.properties: вне dev Collector'а нет, и пустой
# endpoint сохраняет noop SDK (test-профиль, prod). Collector'а нет — тихий отказ,
# приложение работает без экспорта. env-переменная перекрывает значение.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# Axelix (локальный trial): приложение регистрируется само в Master, который запущен
# на хосте через docker run (ghcr.io/axelixlabs/axelix). instance-actuator-url — адрес
# управляющего порта (8081), доступный из контейнера Master как host.docker.internal,
# поэтому MANAGEMENT_ADDRESS должен оставаться 0.0.0.0.
axelix.sbs.discovery.self-registration=true
axelix.sbs.discovery.master-url=http://localhost:2935/api/internal/service/register
axelix.sbs.discovery.instance-actuator-url=http://host.docker.internal:8081/actuator
axelix.sbs.discovery.instance-name=realhelpdesk-api
