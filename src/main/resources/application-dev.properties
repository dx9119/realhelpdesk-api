# Локальная отладка: трассировка приложения и SQL без значений параметров
# (bind TRACE печатает параметры запросов, среди них бывают пароли и токены).

logging.level.root=INFO
logging.level.com.ukhanov.realhelpdesk=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Медленные запросы и метрики Hibernate: статистика нужна для hibernate.*-метрик,
# в prod она выключена — накладные расходы не оправданы без алертов по этим метрикам.
spring.jpa.properties.hibernate.generate_statistics=true
