# Рабочий контур: бизнес-события и сбои. Пошаговая трассировка и SQL выключены.

logging.level.root=INFO
logging.level.com.ukhanov.realhelpdesk=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.apache.coyote=WARN
# springdoc при каждом старте пишет WARN «endpoint is enabled by default»: спека и UI включены
# осознанно (см. docs/api.md), в prod это шум — гасим только его собственные предупреждения
logging.level.org.springdoc=ERROR

# --- Структурированные логи ---
# JSON по ECS во всех профилях кроме dev (см. logback-spring.xml); system-свойство
# CONSOLE_LOG_STRUCTURED_FORMAT задаёт конвертеру формат.
logging.structured.format.console=ecs
# IP клиента не входит в prod-логи (решение DEBUG_PATTERN/ClientIpResolver): в JSON он
# пришёл бы из MDC — исключаем по имени поля.
logging.structured.json.exclude=clientIp
# Медленные запросы Hibernate пишет INFO-логгер org.hibernate.SQL_SLOW, который наследует
# уровень org.hibernate=WARN и без этой строки подавлялся бы.
logging.level.org.hibernate.SQL_SLOW=INFO

# --- Инварианты рабочего контура ---
# Профильный файл перекрывает base-конфиг и env-подстановки: окружением эти
# ключи вернуть нельзя — по образцу ddl-auto=validate. Prod-preflight
# (ProdPreflightValidator) дополнительно ловит капчу/CORS/keystore.

# SQL-трассировка: только отладка, в рабочем контуре — тишина
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Миграции обязательны: без них validate упадёт либо схема останется старой
spring.liquibase.enabled=true

# В ответах ошибок нет текста исключения и стектрейса (информация для атакующего)
server.error.include-message=never
server.error.include-stacktrace=never
