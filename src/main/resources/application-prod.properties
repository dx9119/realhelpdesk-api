# Рабочий контур: бизнес-события и сбои. Пошаговая трассировка и SQL выключены.

logging.level.root=INFO
logging.level.com.ukhanov.realhelpdesk=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.apache.coyote=WARN
# Springdoc в рабочем контуре выключен (блок «Инварианты» ниже); ERROR — на случай
# остаточного шума его собственных WARN при старте.
logging.level.org.springdoc=ERROR

# --- Структурированные логи ---
# JSON по ECS во всех профилях кроме dev (см. logback-spring.xml); system-свойство
# CONSOLE_LOG_STRUCTURED_FORMAT задаёт конвертеру формат.
logging.structured.format.console=ecs
# IP клиента не входит в prod-логи (решение DEBUG_PATTERN/ClientIpResolver): в JSON он
# пришёл бы из MDC — исключаем по имени поля.
logging.structured.json.exclude=clientIp
# Медленные запросы Hibernate пишет INFO-логгер org.hibernate.SQL_SLOW, который наследует
# уровень org.hibernate=WARN и без этой строки подавлялся бы.
logging.level.org.hibernate.SQL_SLOW=INFO

# --- Инварианты рабочего контура ---
# Профильный файл перекрывает base-конфиг и env-подстановки: окружением эти
# ключи вернуть нельзя — по образцу ddl-auto=validate. Prod-preflight
# (ProdPreflightValidator) дополнительно ловит капчу/CORS/keystore.

# OpenAPI отключён в рабочем контуре по трём причинам:
#
# 1. Безопасность: /v3/api-docs и /swagger-ui.html раскрывают контракт API
#    (эндпоинты, структуры DTO, поля запросов/ответов) без аутентификации —
#    эти эндпоинты permitAll в security-конфиге. В продакшене это излишняя
#    поверхность атаки: атакующий получает полную карту API.
#
# 2. Ресурсы: swagger-ui-webjar (~15 МБ) и сборка OpenAPI-спеки из
#    контроллеров добавляют память и CPU на каждый запрос /v3/api-docs
#    (генерация Schema, Parameter, Response из аннотаций). В рабочем контуре
#    это пустая трата ресурсов, которые идут на бизнес-логику.
#
# 3. Избыточность: машинная спецификация для интеграций — отдельный
#    контур (dev-стенд, make dev-openapi), а Swagger UI — интерактивная
#    отладка для разработчиков. В продакшене ни отладка, ни интерактивность
#    не нужны.
#
# Спека dev-стенда собирается из dev-контура и не страдает:
# make dev-openapi, make dev-openapi-types.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# SQL-трассировка: только отладка, в рабочем контуре — тишина
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Миграции обязательны: без них validate упадёт либо схема останется старой
spring.liquibase.enabled=true

# В ответах ошибок нет текста исключения и стектрейса (информация для атакующего)
server.error.include-message=never
server.error.include-stacktrace=never
