<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Подтверждение регистрации</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;">
<tr>
<td align="center" style="padding: 24px 0;">
<table role="presentation" width="600" border="0" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
<tr>
<td th:replace="~{mail/fragments/header :: mailHeader}"></td>
</tr>
<tr>
<td style="padding: 32px 40px 24px; color:#1a1a1a; font-size:15px; line-height:1.6;">
<p style="margin:0 0 16px;">Добрый день!</p>
<p style="margin:0 0 16px;">
Для завершения регистрации в системе «<span th:text="${projectName}">real help desk</span>»,
пожалуйста, подтвердите ваш адрес электронной почты, перейдите по ссылке:
</p>
<p style="margin:0 0 16px;">
<a th:href="${baseUrl} + '/notify-settings'" style="display:inline-block; padding:10px 24px; background-color:#2563eb; color:#ffffff; text-decoration:none; border-radius:6px;">
Перейти к настройкам уведомлений
</a>
</p>
<p style="margin:0 0 16px;">
В поле «✅ Подтверждение Email», введите данный код:
</p>
<p style="margin:0 0 24px;">
<span th:text="${token}" style="font-size:24px; font-weight:bold; font-family:monospace; color:#2563eb; letter-spacing:2px;">000000</span>
</p>
<p style="margin:0;">С уважением,<br/>Команда <span th:text="${projectName}">real help desk</span></p>
</td>
</tr>
<tr>
<td th:replace="~{mail/fragments/footer :: mailFooter}"></td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
