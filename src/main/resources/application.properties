# ===========================================================================
# Схема конфигурации: обязательные переменные окружения вида ${VAR} или
# ${VAR:default} — где default — разумное значение по умолчанию.
#
# Значения по умолчанию задаются здесь, в application.properties.
# Секреты (JWT_SECRET, DB_PASSWORD, MAIL_PASSWORD, KEY_STORE_PASS,
# MINIO_ROOT_USER, MINIO_ROOT_PASSWORD) и специфичные для среды ключи
# (MAIL_HOST, CORS_ALLOWED_ORIGINS, DB_URL, MINIO_ENDPOINT) — без дефолтов:
# приложение валится на старте, если переменная не задана.
#
# Исключения из ${VAR} без дефолта — два и намеренные. Первый:
# spring.jpa.hibernate.ddl-auto — режим закреплён здесь, окружением не
# управляется, чтобы изменяющий схему режим нельзя было вернуть ни через
# compose, ни через infrastructure/.env. Второй: server.ssl.enabled=${SSL_ENABLED:true}
# — включён по умолчанию (контейнер и рабочий контур), выключается только
# точечно (IDEA-запуск: SSL_ENABLED=false). Перечень исключений —
# NON_SCHEMA_KEYS в ApplicationConfigSchemaTest (он же следит, чтобы
# деструктивный режим не появился нигде в конфигурации среды).
#
# Отсутствующая переменная без дефолта валит приложение на старте с
# "Could not resolve placeholder '<VAR>'" — тихих подстановок нет.
#
# Доменные имена и URL вынесены в application-domains.properties — он
# подключён ниже через spring.config.import.
# ===========================================================================

# Домены: токены, ссылки в письмах, CORS. Обязательный импорт — без него
# эти ключи просто не попадут в контекст, а ApplicationConfigSchemaTest
# сверяет схему обоих файлов с infrastructure/.env.example и services.app.environment.
spring.config.import=classpath:application-domains.properties

# dev — локальная отладка; prod — рабочий контур.
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# APP
spring.application.name=${APP_NAME}

# SERVER
server.port=${SERVER_PORT:8443}
# HTTPS по умолчанию (контейнер, рабочий контур). Локальный отладочный запуск
# из IDEA выключает его инлайном (SSL_ENABLED=false, см. .run/ и профиль host) —
# иначе нужен keystore на хосту.
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${KEY_STORE_PATH:file:/app/ssl/keystore.p12}
server.ssl.key-store-password=${KEY_STORE_PASS}
server.ssl.key-store-type=${KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${KEY_STORE_ALIAS:tomcat}

# Уровни логов задают application-dev.properties и application-prod.properties.

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
# Режим закреплён в коде (см. шапку файла): Liquibase ведёт структуру, Hibernate
# только сверяет entity с ней и валит старт при расхождении. Схема БД при
# рестарте и при падении процесса не трогается, данных не теряется.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# Liquibase: миграции схемы выполняются до старта Hibernate, который в режиме
# validate сверяет entity с результатом миграции (db/changelog/db.changelog-master.xml).
spring.liquibase.enabled=${DB_MIGRATIONS_ENABLED:true}
spring.liquibase.change-log=${DB_MIGRATIONS_CHANGE_LOG:classpath:db/changelog/db.changelog-master.xml}
# Контекст миграций: schema (дефолт) — только структура, seed — поверх неё
# локальные фикстуры. Changeset без context выполняется при любом значении,
# поэтому DDL применяется всегда, а фикстуры помечены context="seed" и не
# попадают в базу, пока контекст явно не запрошен.
spring.liquibase.contexts=${DB_MIGRATIONS_CONTEXTS:schema}

# OSIV
spring.jpa.open-in-view=${JPA_OSIV:false}

# JWT (issuer и audience — домены, см. application-domains.properties). Сроки жизни
# токенов — в секундах: удобно задавать маленькие значения для проверок.
jwt.secret-for-gen-jwt=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
# Ротация refresh-токенов в БД (см. RefreshTokenCleanupService): фоновая задача
# удаляет отозванные строки jwt_tokens старше jwt.revoked-token-retention-seconds и
# активные строки старше срока жизни токена (jwt.refresh-token-expiration-seconds).
# Удаление идёт батчами с адаптивным размером и паузой, чтобы не давать пиковую
# нагрузку на БД.
jwt.revoked-token-retention-seconds=${JWT_REVOKED_TOKEN_RETENTION_SECONDS:604800}
jwt.token-cleanup-cron=${JWT_TOKEN_CLEANUP_CRON:0 30 3 * * *}
jwt.token-cleanup-batch-min-size=${JWT_TOKEN_CLEANUP_BATCH_MIN_SIZE:100}
jwt.token-cleanup-batch-max-size=${JWT_TOKEN_CLEANUP_BATCH_MAX_SIZE:5000}
jwt.token-cleanup-target-batch-ms=${JWT_TOKEN_CLEANUP_TARGET_BATCH_MS:200}
jwt.token-cleanup-batch-pause-ms=${JWT_TOKEN_CLEANUP_BATCH_PAUSE_MS:50}
# SameSite для auth-cookie: None — кросс-доменный фронт; Lax — фронт на том же сайте.
# Допустимые значения (весь набор — enum SameSite в коде): None, Lax, Strict.
# Регистр не важен (None/none/NONE), неизвестное значение валит старт приложения.
jwt.cookie.same-site=${JWT_COOKIE_SAMESITE:None}
# Домен для auth-cookie: пусто — cookie привязан к конкретному хосту (host-only,
# как раньше); .example.com — общий для поддоменов, без него файлы на отдельном
# домене (static.base-url) браузеру не отправить — скачивание вернёт 401.
jwt.cookie.domain=${JWT_COOKIE_DOMAIN:}

# Оператор-бутстрап: список email (через запятую), которым при старте назначается
# ROLE_OPERATOR. Повышаются только уже зарегистрированные пользователи с
# подтверждённым email; список только повышает (снятия роли нет).
operator.bootstrap.emails=${APP_OPERATOR_EMAILS:}

# Mail - SMTP
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
# Таймауты SMTP (мс) — connectiontimeout — установка соединения, timeout —
# чтение ответа сервера, writetimeout — запись.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:3000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

# Mail content (домены писем — в application-domains.properties)
email.project-name=${APP_PROJECT_NAME:real help desk}

# Captcha: включение, HMAC-секрет подписи PoW-токенов, сложность Proof-of-Work
# и сроки (challenge/токен/минимальное время заполнения формы — секунды).
captcha.enabled=${CAPTCHA_ENABLED:false}
captcha.hmac-secret=${CAPTCHA_HMAC_SECRET}
captcha.pow-difficulty=${CAPTCHA_POW_DIFFICULTY:18}
captcha.challenge-ttl-seconds=${CAPTCHA_CHALLENGE_TTL_SECONDS:300}
captcha.token-ttl-seconds=${CAPTCHA_TOKEN_TTL_SECONDS:300}
captcha.min-fill-seconds=${CAPTCHA_MIN_FILL_SECONDS:0}
# Эскалация по риску (локальный риск-движок): провалы одного IP — мягкий риск
# (усложнение PoW), провалы многих IP одной подсети — признак распределённой
# атаки (эмодзи-задание вместо PoW).
captcha.emoji-enabled=${CAPTCHA_EMOJI_ENABLED:true}
captcha.risk-failure-threshold=${CAPTCHA_RISK_FAILURE_THRESHOLD:5}
captcha.risk-failure-window-seconds=${CAPTCHA_RISK_FAILURE_WINDOW_SECONDS:600}
captcha.risk-elevated-difficulty-bonus=${CAPTCHA_RISK_ELEVATED_DIFFICULTY_BONUS:3}
captcha.risk-subnet-offender-threshold=${CAPTCHA_RISK_SUBNET_OFFENDER_THRESHOLD:3}
captcha.risk-subnet-prefix-v4=${CAPTCHA_RISK_SUBNET_PREFIX_V4:24}
captcha.risk-subnet-prefix-v6=${CAPTCHA_RISK_SUBNET_PREFIX_V6:64}

# IP клиента (логи и ключ рейт-лимита): заголовки прокси доверяем только за прокси,
# порядок заголовков — через запятую, индекс элемента списка (0 — первый слева, -1 — справа)
client-ip.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}
client-ip.headers=${CLIENT_IP_HEADERS:X-Forwarded-For,X-Real-IP,CF-Connecting-IP,True-Client-IP,X-Client-IP,Proxy-Client-IP,WL-Proxy-Client-IP,Forwarded}
client-ip.forwarded-index=${CLIENT_IP_FORWARDED_INDEX:0}

# Rate limit: пороги (число запросов / окно в секундах).
# Ключ должен совпадать с key в аннотации @RateLimit на методе контроллера.
ratelimit.limits.auth-register.requests=${RATE_LIMIT_AUTH_REGISTER_REQUESTS:10}
ratelimit.limits.auth-register.window-seconds=${RATE_LIMIT_AUTH_REGISTER_WINDOW_SECONDS:300}
ratelimit.limits.auth-login.requests=${RATE_LIMIT_AUTH_LOGIN_REQUESTS:10}
ratelimit.limits.auth-login.window-seconds=${RATE_LIMIT_AUTH_LOGIN_WINDOW_SECONDS:300}
ratelimit.limits.auth-access-token.requests=${RATE_LIMIT_AUTH_ACCESS_TOKEN_REQUESTS:30}
ratelimit.limits.auth-access-token.window-seconds=${RATE_LIMIT_AUTH_ACCESS_TOKEN_WINDOW_SECONDS:300}
ratelimit.limits.captcha-challenge.requests=${RATE_LIMIT_CAPTCHA_CHALLENGE_REQUESTS:30}
ratelimit.limits.captcha-challenge.window-seconds=${RATE_LIMIT_CAPTCHA_CHALLENGE_WINDOW_SECONDS:60}
ratelimit.limits.captcha-solve.requests=${RATE_LIMIT_CAPTCHA_SOLVE_REQUESTS:30}
ratelimit.limits.captcha-solve.window-seconds=${RATE_LIMIT_CAPTCHA_SOLVE_WINDOW_SECONDS:60}
ratelimit.limits.password-reset-request.requests=${RATE_LIMIT_PASSWORD_RESET_REQUEST_REQUESTS:3}
ratelimit.limits.password-reset-request.window-seconds=${RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW_SECONDS:600}
ratelimit.limits.password-reset-confirm.requests=${RATE_LIMIT_PASSWORD_RESET_CONFIRM_REQUESTS:5}
ratelimit.limits.password-reset-confirm.window-seconds=${RATE_LIMIT_PASSWORD_RESET_CONFIRM_WINDOW_SECONDS:600}
ratelimit.limits.email-code.requests=${RATE_LIMIT_EMAIL_CODE_REQUESTS:3}
ratelimit.limits.email-code.window-seconds=${RATE_LIMIT_EMAIL_CODE_WINDOW_SECONDS:600}
# Лимит писем восстановления пароля на один адрес (окно 86400 сек = 24 часа)
ratelimit.limits.email-recovery.requests=${RATE_LIMIT_EMAIL_RECOVERY_REQUESTS:3}
ratelimit.limits.email-recovery.window-seconds=${RATE_LIMIT_EMAIL_RECOVERY_WINDOW_SECONDS:86400}
# Long polling оповещений: клиент держит один ожидающий запрос ~25 сек
ratelimit.limits.notifications-wait.requests=${RATE_LIMIT_NOTIFICATIONS_WAIT_REQUESTS:30}
ratelimit.limits.notifications-wait.window-seconds=${RATE_LIMIT_NOTIFICATIONS_WAIT_WINDOW_SECONDS:60}
# Передача портала (эндпоинты с проверкой пароля)
ratelimit.limits.portal-transfer-request.requests=${RATE_LIMIT_PORTAL_TRANSFER_REQUEST_REQUESTS:5}
ratelimit.limits.portal-transfer-request.window-seconds=${RATE_LIMIT_PORTAL_TRANSFER_REQUEST_WINDOW_SECONDS:300}
ratelimit.limits.portal-transfer-confirm.requests=${RATE_LIMIT_PORTAL_TRANSFER_CONFIRM_REQUESTS:5}
ratelimit.limits.portal-transfer-confirm.window-seconds=${RATE_LIMIT_PORTAL_TRANSFER_CONFIRM_WINDOW_SECONDS:300}

# MinIO — хранилище файлов вложений заявок (сами файлы в бакете, метаданные в
# attachment_model). Адрес и имя бакета — infrastructure/.env; учётки — те же
# root-учётки MinIO из infrastructure/.env (MINIO_ROOT_USER/MINIO_ROOT_PASSWORD),
# без переименований.
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}
minio.bucket=${MINIO_BUCKET:realhelpdesk-attachments}

# Multipart-загрузка: предел на один файл и на весь запрос. Превышение — 413
# (GlobalExceptionHandler), а не обрыв соединения.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:25MB}

# Cache-Control для отдачи файлов вложений (GET .../attachments/{id}): значение
# уходит в заголовок как есть. private, no-store — ничто не кэширует (дефолт);
# для CDN — обычно public, max-age=..., но только когда доступ к файлу не завязан
# на cookie (авторизация на edge CDN), иначе закрытый файл может отдать кэш.
# Пустое значение — как до настройки, private, no-store.
static.cache-control=${STATIC_CACHE_CONTROL:private, no-store}

# ===========================================================================
# Ниже — литералы, одинаковые для всех окружений.
# Это исключения из схемы ${VAR}: перечень NON_SCHEMA_KEYS в
# ApplicationConfigSchemaTest следит, чтобы новых литералов в файле не
# появлялось мимо списка, а env-управляемые ключи остались в infrastructure/.env.
# ===========================================================================

# --- Пул соединений (Hikari): дефолт из 10 соединений меняем осознанно ---
# Имя пула — тег pool в метриках hikaricp.connections.*: без него в метрике
# фигурировало бы безликовое HikariPool-1, и по имени пула нельзя было бы отличить среду.
spring.datasource.hikari.pool-name=app-main
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
# Порог диагностики утечки соединения: Hikari пишет стек владельца в лог
spring.datasource.hikari.leak-detection-threshold=20000

# --- Hibernate: батчи (батч-инсерты рассылки и батч-фетч) ---
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Медленные запросы: WARN при превышении порога (мс).
# hibernate.log_slow_query в Hibernate 7 — это порог в миллисекундах (long),
# а не boolean-флаг: булево значение роняет старт с NumberFormatException.
spring.jpa.properties.hibernate.log_slow_query=1000

# --- Корректное завершение: в системе long polling на 25 секунд и @Scheduled ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true

# --- Actuator / метрики ---
# Наружу отдаются только health, info и prometheus: env, heapdump, threaddump,
# configprops, beans, mappings в exposure не входят и недоступны.
management.endpoints.web.exposure.include=health,info,prometheus
# Детали health — только аутентифицированному запросу управляющего порта.
management.endpoint.health.show-details=when-authorized
# Пробы оркестратора: liveness — только сам процесс (БД/почта/MinIO не должны
# перезапускать под), readiness — процесс + БД + MinIO: балансировщик перестаёт
# слать трафик при недоступном хранилище файлов.
# Почта — отдельная группа вне liveness/readiness: сбой SMTP не должен
# перезапускать под и останавливать трафик. Имя группы не
# может совпадать с именем contributor'а (Boot 4: «clashes with group»),
# поэтому группа smtp, а блок в деталях — mail.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,minio
management.endpoint.health.group.smtp.include=mail
# Гистограмма и SLO-бакеты для http.server.requests: нужны для p50/p95/p99 и
# алертов по перцентилям. Клиентских percentiles (METER-префикс) не включаем.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s
# Потолок уникальных значений тега uri: Boot добавляет MeterFilter maximumAllowableTags
# и DENYит метрику сверх лимита, чтобы случайный путь не раздувал cardinality.
management.metrics.web.server.max-uri-tags=100
# Отключение неиспользуемых семейств метрик.
# Каждый ключ гасит биндер целиком, что дешевле, чем deny-фильтр на каждый meter.
# tomcat: сессии не используются (stateless JWT) — tomcat_sessions_* всегда шум.
management.metrics.enable.tomcat=false
# hibernate.cache: L2-кэш не подключён — hibernate.cache.* всегда нули.
management.metrics.enable.hibernate.cache=false
# hibernate.entities/collections: счётчики CRUD сущностей дублируют
# hibernate.query.executions и hibernate.statements.
management.metrics.enable.hibernate.entities=false
management.metrics.enable.hibernate.collections=false
# spring.security.filterchains: ~30 семейств before/after-таймеров фильтров;
# 401 и ошибки доступа уже видны в http.server.requests и auth.attempts.
management.metrics.enable.spring.security.filterchains=false
# spring.security.http.secured.requests / authorizations: дублируют
# http.server.requests (uri, status, role).
management.metrics.enable.spring.security.http.secured.requests=false
management.metrics.enable.spring.security.authorizations=false
# spring.data.repository: таймеры по каждому методу репозитория дублируют
# hibernate.query.executions.
management.metrics.enable.spring.data.repository=false
# Экспорт метрик в формате Prometheus.
management.prometheus.metrics.export.enabled=true
# Теги всех метрик: application — имя сервиса, env — активный профиль (dev/prod).
# Отдельная переменная ENV не вводилась, чтобы метка не разъехалась с профилем;
# instance не задаём — метки instance/job добавляет скрейп (alloy) при сборе.
management.metrics.tags.application=${APP_NAME}
management.metrics.tags.env=${SPRING_PROFILES_ACTIVE}
# --- Распределённая трассировка ---
# Sampling: 1.0 на локальном стенде (dev), 0.1 в prod (через env) — доля запросов,
# попадающих в трейс; 0 полностью выключает трейсинг.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY}
# Resource-атрибуты спанов: service.name — имя сервиса, service.version — версия сборки,
# deployment.environment — активный профиль (dev/prod).
management.opentelemetry.resource-attributes.service.name=${APP_NAME}
management.opentelemetry.resource-attributes.service.version=${OTEL_SERVICE_VERSION}
management.opentelemetry.resource-attributes.deployment.environment=${SPRING_PROFILES_ACTIVE}
# OTLP-экспортёр: endpoint бэкенда Collector'а. Spring Boot 4 по умолчанию шлёт
# OTLP по HTTP (http/protobuf), поэтому адрес collector'а — порт 4318 с путём
# /v1/traces (make obs-up передаёт http://otel-collector:4318/v1/traces).
# gRPC-транспорт (порт 4317) включается только явным otlp.transport=grpc.
# Пустое значение отключает экспорт (спаны не уходят, SDK создаётся noop);
# недоступный адрес — тихий отказ, приложение работает без экспорта трейсов.
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT}
# Метрики по OTLP выключены: путь метрик — Prometheus scrape (alloy скрейпит
# management-порт 8081 и пишет в Mimir). starter-opentelemetry тянет
# micrometer-registry-otlp, и без этой строки Boot каждые 60 с пушит метрики
# на дефолтный http://localhost:4318/v1/metrics (в контейнере — connection refused,
# WARN в логах).
management.otlp.metrics.export.enabled=false

# --- Структурированные логи ---
# service.*-поля JSON-записей в профилях кроме dev: имя сервиса берётся из spring.application.name,
# окружение и версия — здесь (в logback-spring.xml включены только в !dev; dev остаётся читаемым).
logging.structured.ecs.service.environment=${SPRING_PROFILES_ACTIVE}
logging.structured.ecs.service.version=${OTEL_SERVICE_VERSION}

# Управляющий порт отдельен от приложения: actuator не живёт на SERVER_PORT,
# на основном порту /actuator/** отвечает 404/401.
# SSL управляющего порта выключен явно: иначе management наследует server.ssl.*
# приложения, и /actuator/prometheus требует TLS (Prometheus шлёт обычный HTTP,
# скрейп падает с 400). Порт светится только loopback и сети compose, Basic-креды
# скрейпа — в infrastructure/.env.
management.server.port=${MANAGEMENT_PORT}
management.server.address=${MANAGEMENT_ADDRESS}
management.server.ssl.enabled=false
# HTTP Basic на /actuator/prometheus: сервисная учётка METRICS_USER/METRICS_PASSWORD
# (пароль — секрет из infrastructure/.env). false — без проверки пароля,
# только если управляющий порт закрыт сетью.
observability.prometheus.auth.enabled=true
observability.prometheus.auth.username=${METRICS_USER}
observability.prometheus.auth.password=${METRICS_PASSWORD}
