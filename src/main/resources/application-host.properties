# Хостовый запуск приложения (IDEA/CLI против dockerized-инфраструктуры).
# Профиль второй и дополнительный: включается поверх dev — make dev-deps или
# spring-boot-docker-compose поднимают инфру, а адреса сервисов указывают на
# loopback хоста. Контейнерное приложение (SPRING_PROFILES_ACTIVE=dev,keycloak
# или prod) этот файл НЕ видит — localhost внутри контейнера это он сам.
#
# Секреты и переменные окружения берутся из infrastructure/.env: в IDEA —
# EnvFile-поле run-конфигурации (.run/RealHelpDeskApplication.run.xml),
# в CLI — set -a && . infrastructure/.env (make run-local).

# --- Адреса инфраструктуры на loopback хоста (порты публикует
# infrastructure/docker-compose.override.yaml). Внимание: OS-env имеет
# приоритет над профильными файлами — MINIO_ENDPOINT из infrastructure/.env
# (http://minio:9000) перебил бы этот адрес, поэтому run-конфиги (.run/,
# scripts/dev/run-local.sh) задают MINIO_ENDPOINT=http://127.0.0.1:9000
# инлайном после загрузки .env. ---
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/${POSTGRES_DB:desk}?reWriteBatchedInserts=true
minio.endpoint=http://127.0.0.1:${MINIO_API_PORT:9000}
spring.mail.host=127.0.0.1
# Keycloak из хоста (профили dev,host,keycloak): KC_JWK_SET_URI из
# infrastructure/.env указывает на контейнерное имя keycloak:8080, а OS-env
# имеет приоритет над профильными файлами — переопределить его здесь нельзя.
# Задайте KC_JWK_SET_URI=http://127.0.0.1:8180/realms/realhelpdesk/protocol/
# openid-connect/certs в env запуска (IDEA/CLI), когда контур Keycloak нужен
# на хосту. Без keycloak работает внутренний JWT-контур приложения.

# --- spring-boot-docker-compose ---
# При старте с профилем host модуль сам поднимает (или подхватывает уже
# поднятые) контейнеры infra+local-tools: файл include-сборка базового compose
# и локального override (порты на хост). Lifecycle start-only: стек не
# останавливается вместе с приложением — им дальше пользуются make/e2e.
# В prod-jar модуль не попадает (spring-boot-maven-plugin исключает его по
# умолчанию), а в контейнере/тестах профиль host не активен.
spring.docker.compose.file=infrastructure/docker-compose.host.yaml
spring.docker.compose.profiles.active=infra,local-tools
spring.docker.compose.lifecycle-management=start-only
