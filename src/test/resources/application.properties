# Конфигурация тестов (mvn test на хосте — в Docker тесты не ходят).
#
# Файл перекрывает src/main/resources/application.properties: тестовые ресурсы
# идут в classpath первыми, поэтому контекст тестов видит только эту конфигурацию.
# Это обязательно: продовая application.properties целиком состоит из
# обязательных ${VAR} без дефолтов, которые в тестовом окружении не заданы.

spring.profiles.active=prod

# Тесты не поднимают docker-инфру: контейнеры для IT стартуют из Testcontainers
# (AbstractIntegrationTest), а модуль spring-boot-docker-compose в тестовом
# контексте не должен читать compose-файл и подхватывать локальный стек.
spring.docker.compose.enabled=false

# Схему в тестах создаёт ddl-auto из самого теста (create-drop), миграции не
# нужны: Liquibase в слайс-тесты не входит, а включение здесь свело бы
# контекст к classpath:/db/changelog/db.changelog-master.yaml по умолчанию.
spring.liquibase.enabled=false
