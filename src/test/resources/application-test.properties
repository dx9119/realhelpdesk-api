# Тестовый профиль полного контекста (@SpringBootTest в *IT): приложение поднимается
# без prod-preflight (он требует боевого keystore и включённых миграций) и без env-файла
# infrastructure/.env. Тестовый application.properties затеняет основной, поэтому
# здесь заново задано то, что приложение иначе берёт оттуда: JWT, MinIO, actuator.
# Значения тестовые, секретов нет.

# Тесты не ходят в docker-инфру: базу и MinIO поднимает Testcontainers
# (AbstractIntegrationTest). Флаг дублируется здесь, потому что профиль test
# перекрывает тестовый application.properties, а модуль docker-compose при
# старте контекста читает compose-файл и мог бы поднять локальный стек.
spring.docker.compose.enabled=false

# --- База данных: PostgreSQL 18 из Testcontainers (AbstractIntegrationTest) ---
# Схему создаёт Liquibase, Hibernate её только проверяет: расхождение миграций с
# entity валит IT — это и есть цель проверки.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Только структура: seed-фикстуры помечены context="seed" и в тестовую базу не попадают.
spring.liquibase.contexts=schema
spring.jpa.hibernate.ddl-auto=validate
# Имя пула Hikari для тега pool в метриках hikaricp.*: тестовый конфиг затеняет основной, поэтому дублируем здесь.
spring.datasource.hikari.pool-name=app-main

# --- JWT: ключ подписи, адреса и сроки (иначе JwtConfig валит старт) ---
# Значение — Base64 от «test-jwt-signing-key-for-unit-tests-only-0123456789»
# (JwtConfig декодирует Base64 и требует ≥32 байт для HS256). Файл в allowlist
# gitleaks (.gitleaks.toml): тестовая фикстура, реального секрета нет.
jwt.secret-for-gen-jwt=dGVzdC1qd3Qtc2lnbmluZy1rZXktZm9yLXVuaXQtdGVzdHMtb25seS0wMTIzNDU2Nzg5
jwt.issuer=https://example.com
jwt.audience=https://example.com
jwt.access-token-expiration-seconds=3600
jwt.refresh-token-expiration-seconds=2592000
jwt.cookie.same-site=Lax
# Ротация refresh-токенов: срок хранения больше срока жизни токена, расписание
# не запускается в пределах теста.
jwt.revoked-token-retention-seconds=604800
jwt.token-cleanup-cron=0 30 3 * * *
jwt.token-cleanup-batch-min-size=100
jwt.token-cleanup-batch-max-size=5000
jwt.token-cleanup-target-batch-ms=200
jwt.token-cleanup-batch-pause-ms=50

# --- MinIO: контейнер поднимает AbstractIntegrationTest, адрес приходит из @DynamicPropertySource ---
# Здесь — только заглушки на случай запуска контекста без базового класса (слайсы):
# клиент собирается на старте, соединение не открывается.
minio.endpoint=http://localhost:19000
minio.access-key=test-access
minio.secret-key=test-secret
minio.bucket=test-bucket

# --- Почта: без spring.mail.host Boot не создаёт JavaMailSender, а он нужен сервису писем ---
spring.mail.protocol=smtp
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Рейт-лимиты: без описания ключа @RateLimit падает с IllegalStateException (require), ---
# в тестах — щедрые пороги, чтобы проверки не упирались в 429.
ratelimit.limits.auth-register.requests=1000
ratelimit.limits.auth-register.window-seconds=60
ratelimit.limits.auth-login.requests=1000
ratelimit.limits.auth-login.window-seconds=60
ratelimit.limits.auth-access-token.requests=1000
ratelimit.limits.auth-access-token.window-seconds=60
ratelimit.limits.captcha-challenge.requests=1000
ratelimit.limits.captcha-challenge.window-seconds=60
ratelimit.limits.captcha-solve.requests=1000
ratelimit.limits.captcha-solve.window-seconds=60
ratelimit.limits.password-reset-request.requests=1000
ratelimit.limits.password-reset-request.window-seconds=60
ratelimit.limits.password-reset-confirm.requests=1000
ratelimit.limits.password-reset-confirm.window-seconds=60
ratelimit.limits.email-code.requests=1000
ratelimit.limits.email-code.window-seconds=60
ratelimit.limits.email-recovery.requests=1000
ratelimit.limits.email-recovery.window-seconds=60
ratelimit.limits.notifications-wait.requests=1000
ratelimit.limits.notifications-wait.window-seconds=60
ratelimit.limits.portal-transfer-request.requests=1000
ratelimit.limits.portal-transfer-request.window-seconds=60
ratelimit.limits.portal-transfer-confirm.requests=1000
ratelimit.limits.portal-transfer-confirm.window-seconds=60

# --- Трассировка: в тестах OTel SDK выключен (noop) — экспорт не нужен,
# TestObservationRegistry подменяет реестр и пишет наблюдения в память.
management.opentelemetry.enabled=false

# --- Прочая схема окружения, без которой контекст не соберётся ---
captcha.enabled=true
# PoW-токены: тестовый секрет (32+ символов), лёгкая сложность и нулевой
# minimum fill — решатель в тестах проходит мгновенно
captcha.hmac-secret=test-only-captcha-hmac-secret-0123456789abcdef
captcha.pow-difficulty=8
captcha.challenge-ttl-seconds=300
captcha.token-ttl-seconds=300
captcha.min-fill-seconds=0
# Риск-движок: порог завышен, чтобы штатные тесты PoW никогда не эскалировали;
# эмодзи-флоу тестируется отдельным IT с порогом 2
captcha.emoji-enabled=true
captcha.risk-failure-threshold=100
captcha.risk-failure-window-seconds=600
captcha.risk-elevated-difficulty-bonus=3
captcha.risk-subnet-offender-threshold=3
captcha.risk-subnet-prefix-v4=24
captcha.risk-subnet-prefix-v6=64
cors.allowed-origins=https://example.com
email.project-name=RealHelpDesk test
static.base-url=
client-ip.trust-proxy-headers=false
client-ip.headers=X-Forwarded-For,X-Real-IP
client-ip.forwarded-index=0

# --- Actuator: наблюдаемость, как в основном конфиге ---
# MinIO поднимается контейнером (AbstractIntegrationTest), но индикатор выключен:
# readiness проверяет только БД, а bucketExists на каждом опросе health не нужен.
management.health.minio.enabled=false
# Почта: SMTP на localhost:25 в тестах не поднят, поэтому индикатор выключен — по той же
# причине, что и minio (иначе общий /actuator/health отдаёт 503). Группа smtp в тестовом
# конфиге не объявляется: main-конфиг затенён, а contributor в несуществующей группе валит старт.
management.health.mail.enabled=false
management.server.port=0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
# В тестовом окружении индикатор minio выключен (management.health.minio.enabled=false),
# поэтому readiness не ссылается на minio-конtributor (иначе старт падает: contributor defined in group does not exist).
management.endpoint.health.group.readiness.include=readinessState,db
# Метрики Hibernate требуют статистики: в тестах она дешёвая и покрывает hibernate.*-гейджи.
spring.jpa.properties.hibernate.generate_statistics=true
management.metrics.web.server.max-uri-tags=100
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=test-app
management.metrics.tags.env=test
observability.prometheus.auth.enabled=true
observability.prometheus.auth.username=test-metrics
observability.prometheus.auth.password=test-password
